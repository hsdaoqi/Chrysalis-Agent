[project]
name = "chrysalis"
version = "0.1.0"
description = "一个从 GenericAgent 风格种子重建的极简自进化 agent。"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "websocket-client>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
tui = [
    "textual>=0.80.0",
]
vision = [
    "mss>=9.0.0",
    "Pillow>=10.0.0",
]
voice = [
    "faster-whisper>=1.0.0",
    "sounddevice>=0.5.0",
    "numpy>=1.24.0",
]

[project.scripts]
chrysalis = "chrysalis.kernel:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["chrysalis*", "configs*", "utils*"]
exclude = ["assets*", "memory*", "workspace*", "data*", "tests*", "temp*", "learn-cc*"]
