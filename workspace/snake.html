<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Toy</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --grid: #1f2937;
      --snake: #22c55e;
      --snake-head: #86efac;
      --food: #f97316;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .wrap {
      width: min(92vw, 560px);
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0.5px;
    }
    .stats {
      display: flex;
      gap: 14px;
      align-items: center;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 14px;
    }
    .stats strong { color: var(--text); }
    canvas {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #0b1220;
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 16px;
      display: block;
      image-rendering: pixelated;
    }
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 14px;
      flex-wrap: wrap;
    }
    .help {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }
    button {
      border: 0;
      border-radius: 12px;
      padding: 10px 14px;
      background: linear-gradient(135deg, var(--accent), #0ea5e9);
      color: white;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(56, 189, 248, 0.22);
    }
    button:hover { filter: brightness(1.05); }
    .overlay {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: 0.18s ease;
    }
    .overlay.show {
      opacity: 1;
      pointer-events: auto;
    }
    .card {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 18px;
      padding: 22px 24px;
      text-align: center;
      min-width: min(88vw, 320px);
    }
    .card h2 { margin: 0 0 8px; }
    .card p { margin: 0 0 16px; color: var(--muted); }
    .keys { color: #cbd5e1; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <h1>🐍 Snake Toy</h1>
      <div class="stats">
        <div>分数：<strong id="score">0</strong></div>
        <div>最高：<strong id="best">0</strong></div>
        <div>速度：<strong id="speed">1.0x</strong></div>
      </div>
    </div>

    <canvas id="game" width="480" height="480"></canvas>

    <div class="controls">
      <div class="help">
        使用 <span class="keys">方向键 / WASD</span> 控制。<br />
        吃到食物会变长，撞墙或撞到自己就结束。
      </div>
      <button id="restart">重新开始</button>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="card">
      <h2>游戏结束</h2>
      <p>按空格或点按钮重新开始</p>
      <button id="playAgain">再来一局</button>
    </div>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const bestEl = document.getElementById('best');
      const speedEl = document.getElementById('speed');
      const overlay = document.getElementById('overlay');
      const restartBtn = document.getElementById('restart');
      const playAgainBtn = document.getElementById('playAgain');

      const grid = 24;
      const cols = canvas.width / grid;
      const rows = canvas.height / grid;
      const baseStepMs = 140;

      let snake, dir, nextDir, food, score, best, alive, acc, lastTime;

      best = Number(localStorage.getItem('snake_best') || 0);
      bestEl.textContent = best;

      function reset() {
        snake = [
          { x: 10, y: 10 },
          { x: 9, y: 10 },
          { x: 8, y: 10 },
        ];
        dir = { x: 1, y: 0 };
        nextDir = { x: 1, y: 0 };
        score = 0;
        alive = true;
        acc = 0;
        lastTime = 0;
        food = spawnFood();
        scoreEl.textContent = score;
        speedEl.textContent = '1.0x';
        overlay.classList.remove('show');
        draw();
      }

      function spawnFood() {
        while (true) {
          const p = {
            x: Math.floor(Math.random() * cols),
            y: Math.floor(Math.random() * rows),
          };
          if (!snake?.some(s => s.x === p.x && s.y === p.y)) return p;
        }
      }

      function setDirection(dx, dy) {
        if (dx === -dir.x && dy === -dir.y) return;
        nextDir = { x: dx, y: dy };
      }

      function update() {
        dir = nextDir;
        const head = snake[0];
        const newHead = { x: head.x + dir.x, y: head.y + dir.y };

        if (newHead.x < 0 || newHead.x >= cols || newHead.y < 0 || newHead.y >= rows) {
          return gameOver();
        }
        if (snake.some(seg => seg.x === newHead.x && seg.y === newHead.y)) {
          return gameOver();
        }

        snake.unshift(newHead);
        if (newHead.x === food.x && newHead.y === food.y) {
          score += 10;
          scoreEl.textContent = score;
          food = spawnFood();
          if (score > best) {
            best = score;
            bestEl.textContent = best;
            localStorage.setItem('snake_best', String(best));
          }
          const speedMul = (1 + score / 100).toFixed(1);
          speedEl.textContent = speedMul + 'x';
        } else {
          snake.pop();
        }
      }

      function gameOver() {
        alive = false;
        overlay.classList.add('show');
      }

      function drawCell(x, y, color, radius = 6) {
        const px = x * grid;
        const py = y * grid;
        ctx.fillStyle = color;
        roundRect(ctx, px + 2, py + 2, grid - 4, grid - 4, radius);
        ctx.fill();
      }

      function roundRect(ctx, x, y, w, h, r) {
        const rr = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + rr, y);
        ctx.arcTo(x + w, y, x + w, y + h, rr);
        ctx.arcTo(x + w, y + h, x, y + h, rr);
        ctx.arcTo(x, y + h, x, y, rr);
        ctx.arcTo(x + w, y, x + w, y, rr);
        ctx.closePath();
      }

      function drawGrid() {
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.08)';
        ctx.lineWidth = 1;
        for (let x = 0; x <= cols; x++) {
          ctx.beginPath();
          ctx.moveTo(x * grid + 0.5, 0);
          ctx.lineTo(x * grid + 0.5, canvas.height);
          ctx.stroke();
        }
        for (let y = 0; y <= rows; y++) {
          ctx.beginPath();
          ctx.moveTo(0, y * grid + 0.5);
          ctx.lineTo(canvas.width, y * grid + 0.5);
          ctx.stroke();
        }
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#0b1220';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        drawGrid();

        // food
        drawCell(food.x, food.y, 'var(--food)', 8);
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        ctx.beginPath();
        ctx.arc(food.x * grid + grid * 0.65, food.y * grid + grid * 0.35, 3, 0, Math.PI * 2);
        ctx.fill();

        // snake
        snake.forEach((seg, i) => {
          drawCell(seg.x, seg.y, i === 0 ? 'var(--snake-head)' : 'var(--snake)', i === 0 ? 8 : 6);
        });
      }

      function loop(ts) {
        if (!lastTime) lastTime = ts;
        const delta = ts - lastTime;
        lastTime = ts;
        if (alive) {
          acc += delta;
          const stepMs = Math.max(65, baseStepMs - score * 0.4);
          while (acc >= stepMs) {
            update();
            acc -= stepMs;
          }
        }
        draw();
        requestAnimationFrame(loop);
      }

      window.addEventListener('keydown', (e) => {
        const k = e.key.toLowerCase();
        if (k === 'arrowup' || k === 'w') setDirection(0, -1);
        else if (k === 'arrowdown' || k === 's') setDirection(0, 1);
        else if (k === 'arrowleft' || k === 'a') setDirection(-1, 0);
        else if (k === 'arrowright' || k === 'd') setDirection(1, 0);
        else if (k === ' ') reset();
      });

      restartBtn.addEventListener('click', reset);
      playAgainBtn.addEventListener('click', reset);

      // touch swipe support
      let touchStart = null;
      canvas.addEventListener('touchstart', (e) => {
        const t = e.touches[0];
        touchStart = { x: t.clientX, y: t.clientY };
      }, { passive: true });
      canvas.addEventListener('touchend', (e) => {
        if (!touchStart) return;
        const t = e.changedTouches[0];
        const dx = t.clientX - touchStart.x;
        const dy = t.clientY - touchStart.y;
        if (Math.abs(dx) > Math.abs(dy)) {
          if (dx > 12) setDirection(1, 0);
          else if (dx < -12) setDirection(-1, 0);
        } else {
          if (dy > 12) setDirection(0, 1);
          else if (dy < -12) setDirection(0, -1);
        }
        touchStart = null;
      });

      reset();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
